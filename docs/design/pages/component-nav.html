<!-- Design reference: board "Nav" from the Circuit design canvas. Inline-styled HTML; {{holes}}, <sc-for>, <sc-if>, <dc-import> are design-tool template syntax (see HANDOFF.md §12). Not production code. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site navigation</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&amp;family=Geist:wght@300..600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes navpulse{0%,100%{opacity:.4}50%{opacity:1}}
.navpulse{animation:navpulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.navpulse{animation:none}}
</style>
</helmet>
<header style="width: 1440px; height: 88px; box-sizing: border-box; padding: 0 120px; display: flex; align-items: center; justify-content: space-between; background: rgba(11,10,18,0.86); border-bottom: 1px solid #221E33; font-family: 'Geist', sans-serif; color: #EEEAF6;">
  <a href="Main.dc.html" aria-label="Nimra Zahid, home" style="display: flex; align-items: center; gap: 14px; height: 48px; color: #EEEAF6; text-decoration: none;">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="8" y="10" width="24" height="20" rx="4" style="fill: #15121F; stroke: #B9A2FF; stroke-width: 1.5;"></rect>
      <line x1="14" y1="4" x2="14" y2="10" style="stroke: #3D3659; stroke-width: 1.5;"></line>
      <line x1="26" y1="4" x2="26" y2="10" style="stroke: #3D3659; stroke-width: 1.5;"></line>
      <line x1="14" y1="30" x2="14" y2="36" style="stroke: #7EE8DF; stroke-width: 1.5;"></line>
      <line x1="26" y1="30" x2="26" y2="36" style="stroke: #7EE8DF; stroke-width: 1.5;"></line>
      <text x="20" y="24.5" style="font-family: 'Fraunces', serif; font-size: 13px; font-style: italic; fill: #EEEAF6; text-anchor: middle;">nz</text>
    </svg>
    <span style="display: flex; flex-direction: column; gap: 3px;">
      <span style="font-family: 'Fraunces', serif; font-size: 20px; line-height: 1; letter-spacing: -0.01em;">Nimra Zahid</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 12px; line-height: 1; letter-spacing: 0.12em; color: #A8A1BC; text-transform: uppercase;">IR researcher · educator</span>
    </span>
  </a>
  <nav aria-label="Primary" style="display: flex; align-items: center; gap: 6px;">
    <sc-for list="{{links}}" as="item" hint-placeholder-count="5">
      <a href="{{item.href}}" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; text-decoration: none; color: {{item.color}}; background: {{item.bg}}; border: 1px solid {{item.border}};">
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{item.indexColor}};">{{item.index}}</span>
        <span>{{item.label}}</span>
      </a>
    </sc-for>
  </nav>
  <div style="display: flex; align-items: center; gap: 12px;">
    <button type="button" aria-label="Switch to light theme" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2B2640; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #EEEAF6; stroke-width: 1.6; stroke-linecap: round;">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
    </button>
    <a href="Contact.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid {{contactBorder}}; background: {{contactBg}}; color: #EEEAF6; font-size: 15px; text-decoration: none;">
      <span class="navpulse" style="width: 8px; height: 8px; border-radius: 4px; background: #7EE8DF;"></span>
      Contact
    </a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","about","research","teaching","cv","writing","contact"],"default":"home"},"$preview":{"width":1440,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const defs = [
      { key: 'about', label: 'About', href: 'About.dc.html', index: '01' },
      { key: 'research', label: 'Research', href: 'Research.dc.html', index: '02' },
      { key: 'teaching', label: 'Teaching', href: 'Teaching.dc.html', index: '03' },
      { key: 'cv', label: 'CV', href: 'CV.dc.html', index: '04' },
      { key: 'writing', label: 'Writing', href: 'Writing.dc.html', index: '05' }
    ];
    const links = defs.map((d) => {
      const on = d.key === active;
      return {
        ...d,
        color: on ? '#EEEAF6' : '#A8A1BC',
        bg: on ? 'rgba(126,232,223,0.08)' : 'transparent',
        border: on ? 'rgba(126,232,223,0.32)' : 'transparent',
        indexColor: on ? '#7EE8DF' : '#8A83A0'
      };
    });
    const contactOn = active === 'contact';
    return {
      links,
      contactBorder: contactOn ? 'rgba(126,232,223,0.5)' : '#2B2640',
      contactBg: contactOn ? 'rgba(126,232,223,0.08)' : 'transparent'
    };
  }
}
</script>
</body>
</html>
